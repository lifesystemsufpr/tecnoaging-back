name: DEVENV - Deploy Backend

on:
  push:
    branches:
      - dev_deploy

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Backend (DEVENV)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      SSH_HOST: ${{ secrets.SSH_HOST_DEV }}
      SSH_USER: ${{ secrets.SSH_USER_DEV }}
      SSH_PORT: ${{ secrets.SSH_PORT_DEV }}

      APP_DIR: /var/www/tecnoaging-api
      PM2_APP: TecnoAging-api

    steps:
      # ─────────────────────────────────────
      # CI STAGE (COMPILAÇÃO)
      # ─────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Runner descartável → instalação determinística
      - name: Install dependencies (CI)
        run: npm ci

      # Prisma Client é necessário para o build (usa DATABASE_URL fake)
      - name: Generate Prisma Client (CI)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
        run: npx prisma generate

      # Build do NestJS
      - name: Build backend
        run: npm run build

      # ─────────────────────────────────────
      # DEPLOY STAGE (SERVIDOR)
      # ─────────────────────────────────────

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEVENV_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare deploy artifact
        run: |
          set -e
          rm -rf deploy_artifact
          mkdir deploy_artifact

          # Código compilado
          cp -r dist deploy_artifact/

          # Prisma schema (necessário no servidor)
          cp -r prisma deploy_artifact/

          # Prisma Config (necessário para o prisma)
          cp prisma.config.ts deploy_artifact/

          # Python Service
          cp -r python-service deploy_artifact/

          # Manifestos de dependência
          cp package.json package-lock.json deploy_artifact/

          # PM2 config (se existir)
          [ -f ecosystem.config.js ] && cp ecosystem.config.js deploy_artifact/

      # ----------------------------------------
      # Deploy via rsync (igual ao outro pipeline)
      # ----------------------------------------
      - name: Enviar arquivos para o servidor
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avz --delete
          path: deploy_artifact/
          remote_path: /opt/tecnoaging/back
          remote_host: ${{ secrets.SSH_HOST_DEV }}
          remote_user: ${{ secrets.SSH_USER_DEV }}
          remote_key: ${{ secrets.DEVENV_SSH_PRIVATE_KEY }}
      
      # ----------------------------------------
      # Pós deploy (SSH)
      # ----------------------------------------
      - name: Pós deploy no servidor
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USER_DEV }}
          key: ${{ secrets.DEVENV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT_DEV }}
          script: |
            set -e
      
            cd /opt/tecnoaging/back
      
            # ------------------------------
            # Garantir .env
            # ------------------------------
            if [ ! -f .env ]; then
              echo "❌ .env não encontrado"
              exit 1
            fi
      
            # Corrigir CRLF (igual você já fazia)
            sed -i 's/\r$//' .env
      
            # ------------------------------
            # Node
            # ------------------------------
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use default || true
      
            # ------------------------------
            # Install
            # ------------------------------
            rm -rf node_modules
            npm install --omit=dev --no-audit --no-fund
      
            # ------------------------------
            # Prisma
            # ------------------------------
            npx prisma generate --schema=prisma/schema.prisma
            npx prisma migrate deploy --schema=prisma/schema.prisma
      
            # ------------------------------
            # PM2
            # ------------------------------
            if [ -f ecosystem.config.js ]; then
              pm2 reload ecosystem.config.js --env development
              pm2 save
            else
              echo "❌ ecosystem.config.js não encontrado"
              exit 1
            fi
      
            echo "✅ Deploy concluído"
